name: Release KoPatch

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Directory Structure
        run: |
          echo "Creating directory structure..."
          
          # Steam-EN 준비
          mkdir -p temp_dist_steam_en/AstralParty_INT/com.unity.addressables
          mkdir -p temp_dist_steam_en/8vJXnINT/AstralParty_INT_Data/StreamingAssets/aa

          if [ -d "build/Steam-EN/AssetBundles" ]; then
            cp -r build/Steam-EN/AssetBundles temp_dist_steam_en/AstralParty_INT/com.unity.addressables/
          else
            echo "Warning: build/Steam-EN/AssetBundles not found."
          fi

          if [ -d "build/Steam-EN/StandaloneWindows64" ]; then
            cp -r build/Steam-EN/StandaloneWindows64 temp_dist_steam_en/8vJXnINT/AstralParty_INT_Data/StreamingAssets/aa/
          else
            echo "Warning: build/Steam-EN/StandaloneWindows64 not found."
          fi

          # Android-JP 준비
          mkdir -p temp_dist_android_jp

          if [ -d "build/Android-JP/AssetBundles" ]; then
            cp -r build/Android-JP/AssetBundles temp_dist_android_jp/
          else
             echo "Warning: build/Android-JP/AssetBundles not found."
          fi

          # Windows-CN 준비
          mkdir -p temp_dist_windows_cn/吉星派对/com.unity.addressables
          mkdir -p "temp_dist_windows_cn/吉星派对_Data/StreamingAssets/aa"

          if [ -d "build/Windows-CN/AssetBundles" ]; then
            cp -r build/Windows-CN/AssetBundles temp_dist_windows_cn/吉星派对/com.unity.addressables/
          else
            echo "Warning: build/Windows-CN/AssetBundles not found."
          fi

          if [ -d "build/Windows-CN/StandaloneWindows64" ]; then
            cp -r build/Windows-CN/StandaloneWindows64 "temp_dist_windows_cn/吉星派对_Data/StreamingAssets/aa/"
          else
            echo "Warning: build/Windows-CN/StandaloneWindows64 not found."
          fi

          # iOS-JP 준비
          mkdir -p temp_dist_ios_jp/

          if [ -d "build/iOS-JP" ]; then
            cp -r build/iOS-JP/. temp_dist_ios_jp/
          else
            echo "Warning: build/iOS-JP not found."
          fi

      - name: Create Zip Archives
        run: |
          VERSION="${{ github.ref_name }}"
          
          # Steam-EN 압축
          if [ -d "temp_dist_steam_en" ]; then
            cd temp_dist_steam_en
            zip -r ../AstralParty-KoPatch-Steam-EN-${VERSION}.zip AstralParty_INT 8vJXnINT
            cd ..
            echo "Created AstralParty-KoPatch-Steam-EN-${VERSION}.zip"
          fi

          # Android-JP 압축
          if [ -d "temp_dist_android_jp" ]; then
            cd temp_dist_android_jp
            zip -r ../AstralParty-KoPatch-Android-JP-${VERSION}.zip .
            cd ..
            echo "Created AstralParty-KoPatch-Android-JP-${VERSION}.zip"
          fi

          # Windows-CN 압축
          if [ -d "temp_dist_windows_cn" ]; then
            cd temp_dist_windows_cn
            zip -r ../AstralParty-KoPatch-Windows-CN-${VERSION}.zip 吉星派对 吉星派对_Data
            cd ..
            echo "Created AstralParty-KoPatch-Windows-CN-${VERSION}.zip"
          fi

          # iOS-JP 압축
          if [ -d "temp_dist_ios_jp" ]; then
            cd temp_dist_ios_jp
            zip -r ../AstralParty-KoPatch-iOS-JP-${VERSION}.zip .
            cd ..
            echo "Created AstralParty-KoPatch-iOS-JP-${VERSION}.zip"
          fi

      - name: Generate Release Notes
        id: release_notes
        env:
          TZ: 'Asia/Seoul'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "Current Tag: ${{ github.ref_name }}"
          echo "Previous Tag: $PREV_TAG"
          
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- [%cd] %s" --date=format-local:"%Y-%m-%d %H:%M" >> release_body.md
          else
            git log --pretty=format:"- [%cd] %s" --date=format-local:"%Y-%m-%d %H:%M" $PREV_TAG..HEAD >> release_body.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            AstralParty-KoPatch-Steam-EN-${{ github.ref_name }}.zip
            AstralParty-KoPatch-Android-JP-${{ github.ref_name }}.zip
            AstralParty-KoPatch-Windows-CN-${{ github.ref_name }}.zip
            AstralParty-KoPatch-iOS-JP-${{ github.ref_name }}.zip
          body_path: release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
