name: Create Release Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare release folder
        run: |
          RELEASE_FOLDER="AstralParty-KoPatch-${{ github.ref_name }}"
          mkdir $RELEASE_FOLDER

          mkdir -p "$RELEASE_FOLDER/AstralParty_INT_Data/StreamingAssets"
          mkdir -p "$RELEASE_FOLDER/AstralParty_INT/com.unity.addressables"
          
          mv release/aa "$RELEASE_FOLDER/AstralParty_INT_Data/StreamingAssets/"
          mv release/AssetBundles "$RELEASE_FOLDER/AstralParty_INT/com.unity.addressables/"
          mv release/적용방법.txt "$RELEASE_FOLDER/"
          echo "${{ github.ref_name }}" > "$RELEASE_FOLDER/version.txt"

      - name: Create zip archive
        run: |
          RELEASE_NAME="AstralParty-KoPatch-${{ github.ref_name }}"
          zip -r "${RELEASE_NAME}.zip" $RELEASE_NAME

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref_name }}
          body: |
            [업데이트 내역](https://astral.maynut.site/release-note)
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./AstralParty-KoPatch-${{ github.ref_name }}.zip
          asset_name: AstralParty-KoPatch-${{ github.ref_name }}.zip
          asset_content_type: application/zip