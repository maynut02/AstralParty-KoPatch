name: Release KoPatch

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Directory Structure
        run: |
          echo "Creating directory structure..."
          
          # Steam-EN 준비
          mkdir -p temp_dist_steam/feimo/AstralParty_INT/com.unity.addressables
          mkdir -p temp_dist_steam/8vJXnINT/AstralParty_INT_Data/StreamingAssets/aa

          if [ -d "steam/en/AssetBundles" ]; then
            cp -r steam/en/AssetBundles temp_dist_steam/feimo/AstralParty_INT/com.unity.addressables/
          else
            echo "Warning: steam/en/AssetBundles not found."
          fi

          if [ -d "steam/en/StandaloneWindows64" ]; then
            cp -r steam/en/StandaloneWindows64 temp_dist_steam/8vJXnINT/AstralParty_INT_Data/StreamingAssets/aa/
          else
            echo "Warning: steam/en/StandaloneWindows64 not found."
          fi

          # Mobile-JP 준비
          mkdir -p temp_dist_mobile

          if [ -d "mobile/jp/AssetBundles" ]; then
            cp -r mobile/jp/AssetBundles temp_dist_mobile/
          else
             echo "Warning: mobile/jp/AssetBundles not found."
          fi

      - name: Create Zip Archives
        run: |
          VERSION="${{ github.ref_name }}"
          
          # Steam-EN 압축
          if [ -d "temp_dist_steam" ]; then
            cd temp_dist_steam
            zip -r ../AstralParty-KoPatch-Steam-EN-${VERSION}.zip feimo 8vJXnINT
            cd ..
            echo "Created AstralParty-KoPatch-Steam-EN-${VERSION}.zip"
          fi

          # Mobile-JP 압축
          if [ -d "temp_dist_mobile" ]; then
            cd temp_dist_mobile
            zip -r ../AstralParty-KoPatch-Mobile-JP-${VERSION}.zip feimo
            cd ..
            echo "Created AstralParty-KoPatch-Mobile-JP-${VERSION}.zip"
          fi

      - name: Generate Release Notes
        id: release_notes
        env:
          TZ: 'Asia/Seoul'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "Current Tag: ${{ github.ref_name }}"
          echo "Previous Tag: $PREV_TAG"
          
          echo "" >> release_body.md
          
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- [%cd] %s" --date=format-local:"%Y-%m-%d %H:%M" >> release_body.md
          else
            git log --pretty=format:"- [%cd] %s" --date=format-local:"%Y-%m-%d %H:%M" $PREV_TAG..HEAD >> release_body.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            AstralParty-KoPatch-Steam-EN-${{ github.ref_name }}.zip
            AstralParty-KoPatch-Mobile-JP-${{ github.ref_name }}.zip
          body_path: release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
